name: Run Jobs Scraper

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # lets you run it manually too

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install playwright

      - name: Install Playwright browsers & system deps
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        run: python scraper/jobs_scraper.py --start-page 1 --end-page 3

      - name: Show scraped output
        run: |
          echo "=== jobs_2026.json ==="
          cat scraper/jobs_2026.json

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scraper/jobs_2026.json
          git diff --cached --quiet || git commit -m "chore: update scraped jobs [skip ci]"
          git push

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobs-results
          path: scraper/jobs_2026.json
          retention-days: 7